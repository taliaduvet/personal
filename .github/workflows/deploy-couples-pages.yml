name: Deploy Personal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Vitest only — fast gate. Full Playwright runs in e2e-parking-lot.yml (does not block Pages).
  test-parking-lot:
    name: Test Parking Lot (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parking-lot-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: parking-lot-app/package-lock.json
      - run: npm ci
      - run: npm run test

  # Deploy even if Parking Lot tests fail so Ledger/Pages are not stuck on an unrelated app.
  build:
    if: ${{ always() && !cancelled() }}
    needs: [test-parking-lot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build output
        run: |
          mkdir -p deploy
          cp index.html deploy/
          cp -r parking-lot-app deploy/
          {
            echo "var SUPABASE_URL='${{ secrets.SUPABASE_URL }}';"
            cat parking-lot-app/config.public.js
          } > deploy/parking-lot-app/config.js
          cp -r mom-parking-lot-app deploy/
          echo "const SUPABASE_URL='${{ secrets.SUPABASE_URL }}'; const SUPABASE_ANON_KEY='${{ secrets.SUPABASE_KEY }}';" > deploy/mom-parking-lot-app/config.js
          mkdir -p deploy/accounting-app/js
          cp accounting-app/index.html accounting-app/styles.css accounting-app/api.js accounting-app/app.js deploy/accounting-app/
          cp accounting-app/js/parse-csv.js deploy/accounting-app/js/
          echo "const SUPABASE_URL='${{ secrets.SUPABASE_URL }}'; const SUPABASE_ANON_KEY='${{ secrets.SUPABASE_KEY }}';" > deploy/accounting-app/config.js
          PL_CFG=deploy/parking-lot-app/config.js
          if grep -q "SUPABASE_URL='';" "$PL_CFG" || grep -qE "SUPABASE_ANON_KEY\s*=\s*'';" "$PL_CFG"; then
            echo "::error::Supabase secrets appear empty. Check repo Settings → Secrets → SUPABASE_URL (config.public.js supplies the anon JWT)."
            exit 1
          fi
          if grep -q "SUPABASE_URL='';" deploy/accounting-app/config.js || grep -q "SUPABASE_ANON_KEY='';" deploy/accounting-app/config.js; then
            echo "::error::Ledger config empty (same secrets as Parking Lot)."
            exit 1
          fi
          if grep -q 'csvumbaxopiolwvyevum' "$PL_CFG"; then
            echo "::error::SUPABASE_URL still points at the old PAUSED project. Set secrets to Talia Duvet Hub: https://feodlwvjcayfgujkxcxm.supabase.co"
            exit 1
          fi
          if grep -qE "SUPABASE_ANON_KEY\s*=\s*'https?://" "$PL_CFG"; then
            echo "::error::SUPABASE_ANON_KEY must be the anon public JWT (starts with eyJ), not a REST URL."
            exit 1
          fi
          if grep -qE "SUPABASE_ANON_KEY\s*=\s*'sb_secret_" "$PL_CFG"; then
            echo "::error::SUPABASE_ANON_KEY is the secret key (sb_secret_…). Use the anon JWT from config.public.js only."
            exit 1
          fi
          if grep -qE "SUPABASE_ANON_KEY\s*=\s*'sb_publishable_" "$PL_CFG"; then
            echo "::error::Deployed config still uses sb_publishable key. Ensure parking-lot-app/config.public.js has the eyJ anon JWT."
            exit 1
          fi
          if ! grep -qE "SUPABASE_ANON_KEY\s*=\s*'eyJ" "$PL_CFG"; then
            echo "::error::Deployed config must include anon JWT (eyJ…) from config.public.js."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
