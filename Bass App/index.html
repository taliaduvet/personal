<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Production Reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #0d0f12;
  --surface: #161a21;
  --surface2: #1e2430;
  --border: #2a3140;
  --text: #e8eaed;
  --muted: #8b939e;
  --accent: #c9a227;
  --warning: #e5a84b;
  --error: #e07a6a;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --font-serif: 'Playfair Display', Georgia, serif;
  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2.5rem;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --duration: 0.25s;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 9999;
}
h1, h2, h3, .zone__title { font-family: var(--font-serif); font-weight: 600; }
a { color: var(--accent); }
.muted { color: var(--muted); }
#protocol-banner {
  background: var(--error);
  color: #fff;
  padding: var(--space-md);
  text-align: center;
}
#protocol-banner[hidden] { display: none; }
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(13, 15, 18, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--space-sm) var(--space-md);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-xs);
}
.site-title { font-family: var(--font-serif); font-size: 1.1rem; margin: 0; }
.disc-nav { display: flex; gap: var(--space-xs); }
.disc-tab {
  font-family: inherit;
  font-size: 12px;
  padding: 0.2rem 0.65rem;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: border-color var(--duration) var(--ease), color var(--duration) var(--ease);
}
.disc-tab:hover { color: var(--text); }
.disc-tab--on { border-color: var(--accent); color: var(--accent); background: rgba(201,162,39,0.1); }
.session-strip {
  display: flex;
  gap: var(--space-xs);
  margin-bottom: var(--space-xs);
  align-items: center;
}
.session-strip__label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-right: var(--space-xs);
}
.ctx-input {
  font-family: inherit;
  font-size: 11px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 0.2rem 0.5rem;
  border-radius: 4px;
  width: 80px;
  transition: border-color var(--duration) var(--ease), color var(--duration) var(--ease);
}
.ctx-input::placeholder { color: var(--border); }
.ctx-input:focus { outline: none; border-color: var(--accent); color: var(--text); }
#main-nav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-xs);
  align-items: center;
}
.nav__link {
  color: var(--muted);
  text-decoration: none;
  padding: 0.35rem 0.6rem;
  border-radius: 4px;
  font-size: 12px;
}
.nav__link:hover { color: var(--text); background: var(--surface2); }
.nav__quick {
  margin-left: auto;
  font-family: inherit;
  font-size: 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.35rem 0.75rem;
  border-radius: 4px;
  cursor: pointer;
}
.nav__quick[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
main { max-width: 1200px; margin: 0 auto; padding: var(--space-lg) var(--space-md) var(--space-xl); }
.zone { margin-bottom: var(--space-xl); scroll-margin-top: 7rem; }
.zone__title { font-size: 1.75rem; margin-bottom: var(--space-md); border-bottom: 1px solid var(--border); padding-bottom: var(--space-sm); }
.zone-filters, .zone-categories { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-bottom: var(--space-md); }
.chip {
  font-family: inherit;
  font-size: 11px;
  padding: 0.25rem 0.6rem;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.chip--on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.zone-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--space-md);
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: var(--space-md);
  cursor: pointer;
  transition: border-color var(--duration) var(--ease), transform var(--duration) var(--ease);
  animation: fadeUp var(--duration) var(--ease);
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card__tag { font-size: 10px; text-transform: uppercase; color: var(--accent); letter-spacing: 0.05em; }
.card__title { font-family: var(--font-serif); font-size: 1.1rem; margin: var(--space-sm) 0; }
.card__liner { font-size: 12px; color: var(--muted); margin: 0; }
.char-group { margin-bottom: var(--space-lg); }
.char-group__title { font-size: 1.1rem; color: var(--accent); margin-bottom: var(--space-sm); }
.char-pair {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: var(--space-sm);
  align-items: center;
  padding: var(--space-sm) var(--space-md);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: var(--space-xs);
  cursor: pointer;
}
.char-pair:hover { border-color: var(--accent); }
.char-pole--left { text-align: right; }
.char-spectrum { width: 40px; height: 4px; background: linear-gradient(90deg, var(--muted), var(--accent)); border-radius: 2px; }
.accordion { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: var(--space-sm); }
.accordion summary { padding: var(--space-md); cursor: pointer; font-family: var(--font-serif); }
.accordion__body { padding: 0 var(--space-md) var(--space-md); color: var(--muted); }
.timeline { list-style: none; padding: 0; margin: 0; }
.timeline__item { display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); }
.timeline__num {
  flex-shrink: 0;
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  background: var(--accent);
  color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
}
.field { display: block; margin-bottom: var(--space-md); }
.field__label { display: block; margin-bottom: var(--space-xs); color: var(--muted); font-size: 12px; }
select, input[type="text"], input[type="password"] {
  width: 100%;
  max-width: 400px;
  font-family: inherit;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.5rem;
  border-radius: 4px;
}
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-xs); }
.check { font-size: 12px; display: block; }
.btn {
  font-family: inherit;
  padding: 0.6rem 1.2rem;
  border-radius: 4px;
  border: none;
  cursor: pointer;
}
.btn--primary { background: var(--accent); color: var(--bg); font-weight: 600; }
.alert { padding: var(--space-sm) var(--space-md); border-radius: 4px; margin-top: var(--space-sm); font-size: 13px; }
.alert--error { background: rgba(224, 122, 106, 0.15); color: var(--error); }
#detail-overlay {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  max-width: 720px;
  width: calc(100% - 2rem);
  border-radius: 12px;
  padding: 0;
}
#detail-overlay::backdrop { background: rgba(0,0,0,0.7); }
.dialog-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--border);
}
.dialog-body { padding: var(--space-md) var(--space-lg) var(--space-lg); max-height: 70vh; overflow-y: auto; }
.dialog-close {
  font-family: inherit;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.5rem;
  cursor: pointer;
  line-height: 1;
}
.detail-section { margin-bottom: var(--space-md); }
.detail-section__label { font-family: var(--font-serif); font-size: 1rem; margin: 0 0 var(--space-xs); }
.detail-section__body { color: var(--muted); font-size: 13px; }
.detail-liner { color: var(--muted); font-size: 13px; margin-top: 0; }
.detail-section--helper { border-left: 3px solid var(--accent); padding-left: var(--space-md); }
.character-detail { display: grid; gap: var(--space-lg); }
body.quick-mode .detail-section:not([data-quick]),
body.quick-mode .character-pole,
body.quick-mode .detail-section--helper,
body.quick-mode .detail-liner { display: none !important; }
/* Start Here result cards */
.start-result { display: grid; gap: var(--space-md); }
.start-result--empty { padding: var(--space-md) 0; color: var(--text); }
.start-result__cards { display: flex; flex-direction: column; gap: var(--space-xs); margin-top: var(--space-xs); }
.start-result__card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: var(--space-sm) var(--space-md);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  font-family: inherit;
  color: var(--text);
}
.start-result__card:hover { border-color: var(--accent); background: var(--surface2); }
.start-result__card-title { font-size: 14px; font-weight: 500; }
.start-result__card-liner { font-size: 12px; color: var(--muted); }
/* Foundations zone */
.foundations-empty { font-size: 13px; padding: var(--space-md) 0; }
.foundations-body { display: grid; gap: var(--space-md); padding-top: var(--space-sm); }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 600px) {
  .char-pair { grid-template-columns: 1fr; text-align: center; }
  .char-pole--left { text-align: center; }
  .session-strip { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div id="protocol-banner" hidden>
  Open via a local server — not file://. See README: <code>python3 -m http.server 8765</code>
</div>
<header>
  <div class="header-inner">
    <div class="header-top">
      <h1 class="site-title">Production Reference</h1>
      <nav id="discipline-nav" class="disc-nav"></nav>
    </div>
    <div class="session-strip">
      <span class="session-strip__label">Session</span>
      <input id="ctx-bpm" class="ctx-input" type="text" placeholder="BPM" title="Tempo (e.g. 140)">
      <input id="ctx-key" class="ctx-input" type="text" placeholder="Key" title="Key (e.g. F# minor)">
      <input id="ctx-genre" class="ctx-input" type="text" placeholder="Genre / mood" style="width:130px" title="Genre or mood">
    </div>
    <nav id="main-nav"></nav>
  </div>
</header>
<main id="main"></main>
<dialog id="detail-overlay">
  <div class="dialog-head">
    <div>
      <span id="detail-tag" class="card__tag"></span>
      <h2 id="detail-title"></h2>
    </div>
    <button type="button" class="dialog-close" data-action="close-detail" aria-label="Close">×</button>
  </div>
  <div class="dialog-body" id="detail-body"></div>
</dialog>

};

/* @endregion */

/* @region DATA */

  "bass": {

      {

    "datasets": {
      "STYLES": [
        {
          "id": "808-sub",
          "type": "style",
          "title": "808 / Sub Bass",
          "oneLiner": "One-liner: Felt more than heard. The floor-shaking foundation.",
          "filters": [
            "electronic",

          ],
          "sections": {
            "sound": "Sound: Pure sine wave with a punchy click transient, followed by a long pitched decay. You feel it more than hear it — physical weight between 40–80 Hz. The 808 adds a pitch-dive on attack that gives it that recognisable bloom. Finneas pitches kicks and 808s to the root note of every song.",
            "emotion": "Emotion: Heavy, intimate, threatening, or desolate. Makes the low end feel enormous without being busy.",

            "whenUse": "When to use: Always as a sub layer beneath a character bass (live DI, pluck, analog synth). Never used alone — always layered. Essential in any commercial pop production.",

          "filters": [
            "electronic"
          ],
          "context": {
            "tempo": [

            "density": [

          "sections": {
            "sound": "Sound: Two slightly detuned sawtooth oscillators create constant phase-beating — a \"wub-wub\" or growl. The sound is never static, always moving, and has a dark sinister quality. Historically associated with jungle and DnB; in pop, used as a distortion layer or chorus intensity driver rather than the primary bass. The original Reese was created by Kevin Saunderson in 1988 on a Casio CZ phase-distortion synth — it had a lo-fi gritty character that came from the instrument's limitations.",
            "emotion": "Emotion: Dark, intense, unsettled. The bass equivalent of a clenched jaw.",
            "whenUse": "When to use: Choruses that need to escalate. As a mid-range layer over a sine sub for distorted pop. Eilish's \"Bad Guy\" chorus = layered distorted synths panned ±25–35% L/R over a clean sub. Not usually the solo bass.",

            "whatItDoes": "What it does: Multiple oscillator voices tuned slightly apart create beating — a subtle wobble or chorus effect. Extreme detuning = Reese bass. Subtle detuning = warmth and analog feel.",

            "howToDo": "How to do it: Massive: Voicing tab → Unison → set voices to 2–4. Detune 10–30 cents for warmth, 70–120 cents for Reese-style. Apply Dimension Expander in FX2 to spread the detuned voices in the stereo field — but high-pass at 150Hz so only the upper bass is widened.",
            "wavesPlugins": "Waves plugins: Waves Doubler can add detune-style width to an audio bass track post-recording.",
            "keyTip": "Key tip: Even voices left completely in centre benefit from small amounts of unison — it adds subtle warmth that makes the bass feel \"bigger\" without actually adding width."

        {
          "id": "velocity-variation",
          "type": "technique",
          "title": "Velocity Variation",
          "oneLiner": "One-liner: Uniform velocity sounds like a robot. Variation sounds like a person.",
          "filters": [
            "midi"
          ],
          "sections": {
            "whatItDoes": "What it does: Every MIDI note has a velocity value (0–127). When all notes are the same velocity, the bass sounds mechanical. Real bass players vary their attack constantly — accenting downbeats, ghosting passing notes, emphasising phrase peaks. That variation IS the groove.",
            "whenUse": "When to use: Every single MIDI bass part. Always. No exceptions.",
            "howToDo": "How to do it: In Ableton: open the piano roll, look at the velocity lane at the bottom. Manually draw variation — emphasis notes at 100–110, passing notes at 60–75, ghost notes at 30–45. Or use Ableton's Velocity MIDI Effect with Random parameter set to 8–15 for subtle automatic variation.",
            "wavesPlugins": "Waves plugins: No plugin — this is MIDI editing.",
            "keyTip": "Key tip: The pattern of emphasis tells the story: in 4/4, the downbeat (beat 1) is usually the loudest. Beat 3 is second. Beats 2 and 4 are lighter. Eighth-notes between beats are the lightest. Start there and adjust by ear."
          },
          "meta": {
            "category": "MIDI"
          }
        },
        {
          "id": "note-length-editing",
          "type": "technique",
          "title": "Note Length Editing",
          "oneLiner": "One-liner: Real bass players mute. Your MIDI probably doesn't.",
          "filters": [
            "midi"
          ],
          "sections": {
            "whatItDoes": "What it does: When all MIDI notes are full-length (note to note), they blur into each other. A real bassist mutes strings constantly — creating rhythmic space between notes. That space is what makes a groove feel tight. Shortening notes to 70–85% of their beat value recreates this.",
            "whenUse": "When to use: All programmed bass. Especially important in funk-influenced patterns, fast passages, and anywhere the groove feels muddy or blurred.",
            "howToDo": "How to do it: Select all notes in the piano roll. Manually drag note ends to around 80% of their start-to-start distance. Aim for a small visual gap between each note.",
            "wavesPlugins": "Waves plugins: No plugin — pure MIDI editing.",
            "keyTip": "Key tip: The exception is held notes over chord changes — those should be full length. Only shorten repetitive eighth or sixteenth note patterns, not long melodic phrases."
          },
          "meta": {
            "category": "MIDI"
          }
        },

          "sections": {
            "whatItDoes": "What it does: Swing pushes \"even\" 16th notes slightly later in time — the classic MPC/SP-1200 feel. The result is a subtly elastic, bouncing quality that makes people move.",
            "whenUse": "When to use: Soul, R&B, funk-influenced bass. Any groove-driven production. Even in more electronic pop, a slight swing makes the pattern feel less robotic.",
            "howToDo": "How to do it: Ableton Groove Pool: drag in a groove file (e.g. \"MPC 16 Swing 67%\"). Apply to the bass MIDI clip by dropping it onto the clip. Adjust the Timing amount to 50% and Velocity amount to 50% as a starting point.",
            "wavesPlugins": "Waves plugins: No plugin — Ableton native feature.",

          "filters": [

          "sections": {
            "whatItDoes": "What it does: Any sound pitched down 1–2 octaves can become a bass. A vocal phrase becomes a rumbling texture. A drum tom becomes a melodic bass hit. The result carries the character of the source material into the low end — organic, distinctive, impossible to replicate with a synth.",
            "whenUse": "When to use: When you want something that doesn't sound like a synth bass. When the track already sounds like every other production and you need to stand apart. When you want the bass to have a hidden melodic relationship to a lyric.",
            "howToDo": "How to do it: Record or import audio. In Ableton Simpler: drop in the file, enable Complex Pro or Texture warp mode, pitch down −12 or −24 semitones. Loop a short section. Add a low-pass filter at 200Hz to keep only the bass frequencies. Tune to your key. Add saturation for harmonic content.",
            "wavesPlugins": "Waves plugins: Waves SoundShifter (pitch shifting with formant control).",
            "keyTip": "Key tip: Singing a simple one-note \"aaah\" or \"mmm\" and pitching it down gives you a uniquely warm, organic sub tone. The formant shift makes it sound like a completely different instrument."

          "id": "resampling",
          "type": "technique",
          "title": "Resampling",
          "oneLiner": "One-liner: Bounce your synth to audio, then mangle it. Complexity synthesis can't achieve.",
          "filters": [
            "creative",
            "synthesis"
          ],
          "sections": {
            "whatItDoes": "What it does: Once a synthesised bass is rendered to audio, you can process it with anything — pitch-shift individual notes, reverse sections, apply granular effects, layer it back with the original. The result has the complexity of physical materials rather than the predictability of synthesis.",
            "whenUse": "When to use: When a synth bass is close but not distinctive enough. When you want layered complexity without building a complicated patch. When you want to break out of the familiar sound of a known synthesiser.",
            "howToDo": "How to do it: Build your bass patch in Massive. Record it to audio in Ableton (arm a new audio track, set input to Massive, record). Now treat the audio recording as raw material. Pitch it up or down. Reverse small sections. Apply granular effects (Ableton Granulator). Layer the audio back with the original MIDI synth at a low level.",
            "wavesPlugins": "Waves plugins: Waves SoundShifter, Waves Infected Mushroom Pusher.",

          "id": "chorus-hpf-send",
          "type": "technique",
          "title": "Chorus on High-Pass Send",
          "oneLiner": "One-liner: Width in the mids only. Sub stays mono and stable.",
          "filters": [
            "creative",
            "processing"
          ],
          "sections": {
            "whatItDoes": "What it does: Routing the bass to a send with a chorus — but high-passing that send above 150–200Hz — adds stereo movement and warmth to the upper bass without touching the sub frequencies. The low end stays mono and punchy; the mids feel wide and alive.",
            "whenUse": "When to use: When a bass sounds too narrow and centred. When you want Juno-style warmth and movement. Indie, dream-pop, retro-influenced productions.",

            "wavesPlugins": "Waves plugins: Waves Doubler, Waves MetaFlanger (low-depth chorus mode).",

          "id": "transient-shaping",

          "filters": [

          "sections": {
            "whatItDoes": "What it does: A transient shaper controls the attack portion of a sound independently from the body/sustain. Boosting attack = more click and definition at the note onset. Reducing sustain = tighter, cleaner notes that don't blur into each other.",
            "whenUse": "When to use: A bass that has good tone but indistinct note attacks. A DI bass where the string attack is buried. A sub that blooms too long and clutters the mix.",
            "howToDo": "How to do it: Waves Trans-X (Multi mode). Set the Low band (below 150Hz): reduce Sustain by 3–5dB to tighten the sub bloom. Increase Attack on the Mid band (150Hz–1kHz) by 2–3dB for note definition.",
            "wavesPlugins": "Waves plugins: Waves Trans-X Multi (most useful for bass — multiband).",
            "keyTip": "Key tip: For 808-style basses: be careful reducing sustain — the decaying pitch tail IS the sound. Instead, use slight attack increase to make the initial hit more percussive without shortening the tail."

          "id": "frequency-zoning",
          "type": "technique",
          "title": "Frequency Zoning (Kick + Bass)",
          "oneLiner": "One-liner: Decide who owns the sub. Then give them that space exclusively.",
          "filters": [
            "mixing"
          ],
          "sections": {
            "whatItDoes": "What it does: The kick drum and bass occupy the same frequency territory. They will fight unless you assign ownership. Option A: Bass owns sub (40–80Hz), kick is a click (80Hz+). Option B: Kick owns sub, bass lives above 80Hz. There is no third option.",
            "whenUse": "When to use: Always. Before you EQ, compress, or sidechain anything, decide this. The choice determines your entire low-end strategy.",

            "wavesPlugins": "Waves plugins: Waves F6 (surgical dynamic EQ on the bass, triggered by kick sidechain on specific band).",
            "keyTip": "Key tip: You can zone differently per section — kick owns sub in the verse (sparse, kick leads), bass owns sub in the chorus (full, bass-forward). Automate the HPFs."

            "category": "Mixing"

          "title": "Mono Compatibility",
          "oneLiner": "One-liner: Your mix will be played in mono. Test it throughout, not just at the end.",
          "filters": [
            "mixing"
          ],
          "sections": {
            "whatItDoes": "What it does: Phase problems in the low end cause frequencies to cancel when a stereo signal is summed to mono. Bluetooth speakers, phone speakers, and many club systems are mono or near-mono. A bass that disappears in mono is invisible to most listeners.",
            "whenUse": "When to use: Throughout the mixing process. Collapse to mono every 30 minutes and check the low end hasn't changed significantly.",
            "howToDo": "How to do it: Ableton: place a Utility plugin on the master with Width set to 0% (mono). Toggle on and off. The bass should feel similar in both states — slightly narrower in mono is fine, but shouldn't dramatically lose weight or clarity.",

            "category": "Mixing"

          "oneLiner": "One-liner: Group all bass tracks together. Process the combination, not the parts.",
          "filters": [

          "sections": {

          "id": "gain-staging",
          "type": "technique",
          "title": "Gain Staging",
          "oneLiner": "One-liner: Output at the right level going into every plugin. Fix this first.",
          "filters": [
            "mixing"
          ],
          "sections": {
            "whatItDoes": "What it does: Plugins are calibrated to work best at specific input levels (usually around −18dBFS RMS or −12dBFS peak for analog emulations). Too hot into a compressor = heavy-handed artifacts. Too quiet into a saturator = no effect.",
            "whenUse": "When to use: At the very start of every session, before any processing.",

            "category": "Mixing"

      "WRITING": [
        {
          "id": "writing-01",
          "type": "writing",
          "title": "01 — Root vs Non-Root Movement",
          "oneLiner": "The most fundamental writing decision. A root-note bassline stays on the root of each chord — almost invisible to the li",
          "filters": [
            "writing"
          ],
          "sections": {
            "body": "The most fundamental writing decision. A root-note bassline stays on the root of each chord — almost invisible to the listener. A non-root bassline moves between chord tones, passing tones, and chromatic approach notes — it's a featured instrument. Both are valid, but they serve completely different functions and communicate completely different things.\nRoot-note bass is the foundation of most commercial pop. It would be wrong any other way on a track like Adele's \"Hello\" — the vocal is the entire story. The bass's job is to stay out of the way and anchor the harmony.\nNon-root bass has opinions. Paul McCartney's bass on Beatles records is melodically active and memorable — \"Something,\" \"Come Together,\" \"With a Little Help From My Friends\" all have bass lines that are independently musical. Pino Palladino's work with D'Angelo and John Mayer creates counter-melodies that are as memorable as the vocal.\nRule: if the listener should be thinking about the bass, use non-root movement. If the listener should never think about it, stay on roots.\nFor vocal-led singer-songwriter production like Cycles: root on the downbeat, non-root on passing notes within the bar, root again at the next chord change. This gives harmonic clarity while adding subtle movement that makes the arrangement feel alive."
          },
          "meta": {}
        },
        {
          "id": "writing-02",
          "type": "writing",
          "title": "02 — Rhythm and the Pocket",
          "oneLiner": "The rhythm of the bassline determines the energy of the track more than any other single decision. A whole-note bass (on",
          "filters": [
            "writing"
          ],
          "sections": {
            "body": "The rhythm of the bassline determines the energy of the track more than any other single decision. A whole-note bass (one note per bar) feels sparse and open. A straight eighth-note bass (eight notes per bar) feels busy and driving. Where between those poles you sit determines whether the track breathes or pushes.\nThe \"pocket\" is where the bass and kick drum lock together. The classic pocket in most pop and R&B: bass hits on beat 1 and usually beat 3, with the kick drum hitting on beats 1 and 3 (or in syncopated variations around them). When the bass and kick hit the same note at the same time, the low end feels unified and powerful. When intentionally offset, you get rhythmic tension.\nTry this: write your bassline by looking at the kick pattern first. Where does the kick hit? Put a bass note there. Then add one more note between those kicks at roughly 80% velocity. That's your starting rhythm.\nThe most common mistake in programmed bass: putting a note on every single beat and subdividing constantly. Real bass players breathe — they leave space. Write space deliberately."
          },
          "meta": {}
        },
        {
          "id": "writing-03",
          "type": "writing",
          "title": "03 — Following the Vocal",
          "oneLiner": "In vocal-led music, the bass and vocal are in constant conversation — even when it's not obvious. The bass should genera",
          "filters": [
            "writing"
          ],
          "sections": {
            "body": "In vocal-led music, the bass and vocal are in constant conversation — even when it's not obvious. The bass should generally leave space where the vocal is most active, and move where the vocal breathes or rests.\nRegister matters enormously. If you sing in chest voice below G3 (roughly), your voice and the upper bass occupy the same frequency range. A busy or present bass in that register will compete directly with your voice for the listener's attention — and you'll both lose. This is why Eilish's bass is almost always in the sub range during verses: her voice sits low, and the bass has to get out of the way.\nPractical test: record yourself singing the vocal. Look at the spectral content in Ableton's spectrum analyser. Where does your voice spend most of its time? Now look at where the bass lives. If they overlap significantly — you have a problem.\nThe other consideration is rhythm. If your vocal has a lot of syllables and movement in a bar, the bass should be simpler — a counter-weight rather than a mirror. If your vocal is a held note over several beats, the bass can be more active and melodic underneath it."
          },
          "meta": {}
        },
        {
          "id": "writing-04",
          "type": "writing",
          "title": "04 — Static vs Active Basslines",
          "oneLiner": "A static bassline plays the same pattern every bar. An active bassline fills, varies, and responds bar to bar. Neither i",
          "filters": [
            "writing"
          ],
          "sections": {
            "body": "A static bassline plays the same pattern every bar. An active bassline fills, varies, and responds bar to bar. Neither is better — they serve different emotional functions.\nStatic basslines build tension and hypnosis through repetition. A single repeated pattern that locks with the kick creates inevitability — the listener stops hearing the bass as a melody and starts feeling it as a pulse. This is most of electronic music, dance-pop, hip-hop. Chinchilla's pumping synth bass in \"Cut You Off\" is static on purpose — the pattern never changes, only the sidechain compression gives it motion.\nActive basslines tell stories. They imply a player who is present and making decisions. They add information. They lift arrangement sections — a fill at the end of every fourth bar signals that something is coming, even before it arrives.\nFor vocal-led pop: static pattern in the verse (let the vocal move), active fills at the end of phrases (signal the chorus), busier in the chorus only if the arrangement thins out to give space."
          },
          "meta": {}
        },
        {
          "id": "writing-05",
          "type": "writing",
          "title": "05 — The Bass and the Chorus",
          "oneLiner": "Choruses need to feel bigger than verses. The bass is one of the most powerful tools for creating that perception of gro",
          "filters": [
            "writing"
          ],
          "sections": {
            "body": "Choruses need to feel bigger than verses. The bass is one of the most powerful tools for creating that perception of growth — but it's easily overused.\nThe most common approach: the verse bass is sparse and in the sub range (just felt), the chorus bass is more present with more upper harmonic content (heard as well as felt). This is exactly what Eilish does in \"Bad Guy\" — verse has a clean sub, chorus adds distorted layers panned left and right. The bass got louder and wider, but the actual note pattern is very similar.\nAlternative approach: the chorus bass is simpler and more locked to the kick than the verse. This sounds counterintuitive but it works because the other instruments are adding complexity — the bass's job in the chorus is to be the anchor that stops everything flying apart.\nQuestion to ask at each chorus: does the bass need to do more, or does it need to do less and do it harder?\nThe one thing that almost never works: making the bassline more melodically complex in the chorus. The chorus already has a lot happening. A melodically busy bass adds confusion exactly when the listener needs clarity."
          },
          "meta": {}
        },
        {
          "id": "writing-06",
          "type": "writing",
          "title": "06 — Space and Silence",
          "oneLiner": "Silence in a bassline is not absence — it's a rhythmic choice. The space between notes is where the groove lives. A bass",
          "filters": [
            "writing"
          ],
          "sections": {
            "body": "Silence in a bassline is not absence — it's a rhythmic choice. The space between notes is where the groove lives. A bass that plays on every beat creates a different kind of energy than one that syncopates or leaves deliberate gaps.\nThe hardest habit to break in MIDI bassline writing: filling every available space. Real bass players mute strings constantly. Between almost every note there is a brief silence — not audible, but rhythmically present. This is why editing MIDI note lengths to 75–80% of their beat is so important: you're recreating the natural muting behaviour of a physical instrument.\nStrategic silence creates anticipation. If the bass drops out for half a bar before a chorus, the listener's ear reaches forward. When the chorus bass arrives, it feels earned.\nTry this on your current track: remove all bass from the last two beats of each four-bar phrase. Play it back. Does the chorus feel like it arrives harder? It should."
          },
          "meta": {}
        }

        {
          "id": "reference-01",
          "type": "reference",
          "title": "Step 1 — Match the level before you listen",
          "oneLiner": "Import the reference track into Ableton on a separate track.",
          "filters": [
            "reference"
          ],
          "sections": {
            "body": "Import the reference track into Ableton on a separate track. Match its loudness to your mix by ear — not by meter. They should feel equally loud when you A/B them. If the reference is louder, your brain will perceive it as better regardless of what you're actually comparing. Play 8 bars of your mix, then 8 bars of the reference. Adjust the reference volume until you genuinely can't tell which is louder. Now you're ready to listen."
          },
          "meta": {}
        },
        {
          "id": "reference-02",
          "type": "reference",
          "title": "Step 2 — Listen to the whole first",
          "oneLiner": "Before you try to analyse anything, listen to the reference all the way through as music.",
          "filters": [
            "reference"
          ],
          "sections": {
            "body": "Before you try to analyse anything, listen to the reference all the way through as music. Not as a production exercise. Let it affect you. Notice how it makes you feel, when the bass appears to your consciousness, when you stop noticing it. The moments when you stop noticing the bass are the most instructive. That's when it's doing its job perfectly — when it's so appropriate to the song that it becomes invisible. Second listen: pay attention only to the bass. What rhythm is it playing? Does it move melodically or stay on roots? How prominent is it relative to the vocal?"
          },
          "meta": {}
        },
        {
          "id": "reference-03",
          "type": "reference",
          "title": "Step 3 — Identify the style and techniques",
          "oneLiner": "Is it a synth or a real instrument? Real basses have attack irregularity, string noise, and slight timing imprecision.",
          "filters": [
            "reference"
          ],
          "sections": {
            "body": "Is it a synth or a real instrument? Real basses have attack irregularity, string noise, and slight timing imprecision. Synths are perfectly even. If you're not sure — it's probably a synth. Where does the sub live? Check on laptop speakers. If the bass largely disappears — it's a sub-heavy sound (808 or pure sine). If it stays present — it has upper harmonic content. Does it pump? Is there a rhythmic breathing quality that matches the kick? If yes — sidechain compression is present. What does it do rhythmically? Count the notes per bar. Are they on the beat or syncopated? Does the pattern change between verse and chorus?"
          },
          "meta": {}
        },
        {
          "id": "reference-04",
          "type": "reference",
          "title": "Step 4 — Use Ableton's tools to see what you hear",
          "oneLiner": "Ableton's spectrum analyser (on the reference track) will show you the frequency distribution of the bass in the context of the full mix.",
          "filters": [
            "reference"
          ],
          "sections": {
            "body": "Ableton's spectrum analyser (on the reference track) will show you the frequency distribution of the bass in the context of the full mix. Look for where the energy peaks. Useful check: play the reference, then high-pass filter it at 200Hz temporarily on the master. Hear what's left. That's roughly what the bass sounds like on phone speakers — whether audible or mostly gone tells you how much upper harmonic content it has. Low-pass the reference at 200Hz instead. That's the sub layer in isolation. Does it feel substantial or thin?"
          },
          "meta": {}
        },
        {
          "id": "reference-05",
          "type": "reference",
          "title": "Step 5 — Identify what's different from your bass",
          "oneLiner": "Now A/B your mix and the reference specifically on the bass.",
          "filters": [
            "reference"
          ],
          "sections": {
            "body": "Now A/B your mix and the reference specifically on the bass. Ask: Is the reference bass more present or more recessed than yours? Is it warmer or brighter? Does it pump more or less? Does it have more or less harmonic content on small speakers? Does the pattern feel more or less alive? Write down one specific thing that's different. Just one. Fix that before you listen again. Trying to fix everything at once means you fix nothing — you can't isolate what changed."
          },
          "meta": {}
        },
        {
          "id": "reference-06",
          "type": "reference",
          "title": "Step 6 — Trust the A/B more than your solo ear",
          "oneLiner": "Your ears adapt.",
          "filters": [
            "reference"
          ],
          "sections": {
            "body": "Your ears adapt. After 20 minutes in a mix, you can no longer reliably judge what's happening in the low end. The A/B with the reference resets your calibration every time you use it. The practical discipline: every 30 minutes, stop mixing and A/B 16 bars of your mix against 16 bars of the reference at matched levels. Note one thing that's different. Fix it. Return to mixing. This is how professional mixing engineers actually use reference tracks — not as a target to copy, but as a reset that keeps them from drifting."
          },
          "meta": {}
        }

          "id": "vocal-low",
          "type": "vocal",
          "title": "Low Vocal Register",
          "oneLiner": "If you sing in chest voice below G3, your voice and the upper bass occupy the same frequencies.",
          "filters": [
            "vocal"
          ],
          "sections": {
            "body": "If you sing in chest voice below G3, your voice and the upper bass occupy the same frequencies. A present, mid-rich bass will compete directly and mask the vocal. Solution: push the bass into the sub (below 100Hz), cut 200–400Hz on the bass, and rely on sub weight and upper harmonic saturation for translation. Your voice owns the mid-range. This is why Eilish's bass is almost always in the sub range during verses — her voice sits low and the bass has to move."
          },
          "meta": {}
        },
        {
          "id": "vocal-high",

          "filters": [
            "vocal"
          ],
          "sections": {
            "body": "If you primarily sing above C4, your voice lives above the upper bass range. You have more freedom for the bass to have mid-range character without conflict. A warm analog-style bass with body in 150–300Hz will complement rather than compete. Be aware of the 500Hz–1kHz range where bright female vocals and bass character can still clash."
          },
          "meta": {}
        },

          "filters": [

          "sections": {
            "body": "When your vocal has rests, held notes, and breath — the bass can be more active and melodic in those spaces. A static repeating bass under a sparse vocal can feel underwhelming. Use the vocal's silences as permission for the bass to move. A fill where you take a breath, a melodic phrase where you hold a note."
          },
          "meta": {}
        },
        {
          "id": "vocal-dense",
          "type": "vocal",
          "title": "Dense Vocal",
          "oneLiner": "Busy vocal delivery needs a simple bass.",
          "filters": [
            "vocal"
          ],
          "sections": {
            "body": "Busy vocal delivery needs a simple bass. Every syllable is a rhythmic event competing for rhythmic space. A busy bassline creates rhythmic clutter that makes both the vocal and the bass harder to follow. Root notes, simple patterns, let the vocal carry the rhythm and the bass carry the harmony."
          },
          "meta": {}
        },
        {
          "id": "vocal-intimate",
          "type": "vocal",
          "title": "Emotional / Intimate Delivery",
          "oneLiner": "When a vocal performance is emotionally raw and close — the bass should feel the same way.",
          "filters": [
            "vocal"
          ],
          "sections": {
            "body": "When a vocal performance is emotionally raw and close — the bass should feel the same way. Warm, slightly imperfect, organic. A perfectly quantised electronic bass under an intimate vocal creates an emotional mismatch. Add groove swing, velocity variation, slight timing imprecision. The bass should sound like it's listening to you."
          },
          "meta": {}
        },
        {
          "id": "vocal-belt",
          "type": "vocal",
          "title": "Powerful / Belt Vocal",
          "oneLiner": "A strong belt vocal has a lot of energy in the 400Hz–2kHz range.",
          "filters": [
            "vocal"
          ],
          "sections": {
            "body": "A strong belt vocal has a lot of energy in the 400Hz–2kHz range. The bass needs to be out of that zone entirely — either in the sub, or in the upper harmonics above 2kHz. A mid-rich bass under a belt vocal creates a congested mix. In choruses with powerful vocals, often the correct bass move is simpler and lower, not more."
          },

        },
        {
          "id": "vocal-low-mids",
          "type": "vocal",
          "title": "Vocal in the Low-Mids (300–600Hz)",
          "oneLiner": "Many pop vocals have their character in the low-mids — warmth, body, presence.",
          "filters": [
            "vocal"

          "sections": {
            "body": "Many pop vocals have their character in the low-mids — warmth, body, presence. If you boost 300–500Hz on your vocal (as many do), you need to cut the same range on the bass. They can't both live there. Use a complementary EQ approach: if the vocal gets warmth, the bass gets clarity, and vice versa. They share the frequency range rather than both claiming it."

          "sections": {
            "sound": "Sound: Kick on beat 1 (sometimes beat 3), snare replaced by 808-tuned claps or rimshots on 2 and 4, and rolling 16th-note hi-hats with heavy velocity automation — quiet to loud swells within a single bar. The trap hi-hat roll is not random: it accelerates into phrase endings, drops out for impact, then rebuilds. Sub-bass 808 fills harmonic space below. The overall pattern is often shockingly empty — the silences between hits carry as much weight as the hits themselves.",

            "whatItDoes": "A single kick sample rarely covers the full frequency range needed. Sub layer (40–80Hz): the weight felt in the chest. Body layer (80–200Hz): the \"thud\" heard on consumer speakers. Click layer (2–5kHz): the attack transient that cuts through dense mixes on small speakers. Three separate layers, each doing one job.",

            "howToDo": "How to do it: Layer 1 (sub): a pure sine or 808 kick, pitched to the root note of the song. Low-pass at 100Hz. Keep mono. Layer 2 (body): a punchy kick sample, HPF at 60Hz, LPF at 400Hz. Layer 3 (click): a transient sample (can be a drumstick click, a wood block, or the top end of a different kick), HPF at 1kHz. Tune each layer to the same root note. Balance: sub at 0dB, body at −3dB to −6dB, click at −6dB to −12dB. Check the combination on laptop speakers — the click and body do the work there.",

          "filters": [

          "sections": {
            "whatItDoes": "Different compressor circuit types respond differently to drum transients, creating distinct sonic characters. Fast VCA (1176-style): catches transients quickly, adds punch and aggression. Slow optical (LA-2A-style): responds to program level, adds warmth and \"program-dependent\" compression. VCA bus (SSL G-Bus-style): glues multiple elements together, adds forward motion (the \"pumping\" from the mix bus). Knowing which to reach for is a core mixing skill.",
            "whenUse": "When to use: 1176 (Waves CLA-76) on individual drums for punch and control — kick, snare. LA-2A (Waves CLA-2A) on room mics or overheads for warmth. SSL G-Bus (Waves SSL G-Bus Compressor) on the drum bus for glue. API 2500 (Waves API 2500) on the drum bus for a punchier, forward-leaning character.",
            "howToDo": "How to do it: Kick: CLA-76, ratio 4:1, attack fast, release fast. 4–6dB GR. Snare: CLA-76, ratio 8:1, attack fast, release fast. 6–8dB GR. Overheads: CLA-2A, program-dependent. Just touching the GR needle. Drum bus: SSL G-Bus, ratio 2:1, attack slow (60ms — lets transients through), release auto. 2–4dB GR. This is the English mix bus compression sound — cohesive, musical, forward.",

            "keyTip": "Key tip: Slow attack on the drum bus compressor is counterintuitive but critical. A fast-attack bus compressor catches the kick and snare transients and squashes them — the drums lose punch. A slow attack (40–80ms) lets the transients pass through uncompressed before the compressor engages — you get glue and density without losing impact."

            "whatItDoes": "When drum sounds come from multiple sources (different sample packs, different years, different rooms), they can sound disconnected in the mix. Bus saturation — light harmonic distortion applied to the whole drum bus — adds a shared harmonic fingerprint that makes them sound like they were recorded in the same room. It also adds the \"analogue warmth\" character that digital drums often lack.",

          "id": "sidechain-drums",
          "type": "technique",
          "title": "Sidechain from Kick",
          "oneLiner": "The kick controls other elements in the mix. Creates rhythmic movement and space.",
          "filters": [
            "mixing",

          "sections": {
            "whatItDoes": "The kick drum output is used as a trigger signal to compress (or duck) other elements in the mix — bass, pads, synths. Each kick hit causes those elements to briefly lose level, then recover. The result: the kick has space to punch through (nothing is competing at the moment of impact) and the recovery creates rhythmic motion in the mix.",
            "whenUse": "When to use: Dance music (the sidechain pump IS the genre in house and electropop). Subtle sidechain on bass in any pop/hip-hop production — the kick and bass need different moments. Any mix where the kick and bass are fighting for the same space.",
            "howToDo": "How to do it: Ableton Compressor on the bass or pad channel → Sidechain button → select the kick as the Audio From input. Ratio 4:1–8:1 for subtle, 10:1+ for audible pumping. Attack 3–10ms. Release timed to the tempo: at 120 BPM, 1 beat = 500ms, 1/2 beat = 250ms. For subtle: aim for 2–4dB GR on each kick hit. For pumping: 6–10dB GR. HPF the sidechain signal at 100Hz so only the kick click (not the sub) triggers the compression.",
            "wavesPlugins": "Waves plugins: Waves SSL G-Channel (has sidechain input), Waves C6 (frequency-specific sidechain — only the 60–100Hz band of the bass ducks, not the whole bass signal).",
            "keyTip": "Key tip: Use frequency-specific sidechain (Waves C6 or F6 in dynamic mode) for subtle kick/bass separation. Instead of the whole bass ducking on every kick hit, only the sub-bass frequency band (60–100Hz) ducks — the rest of the bass is unaffected. The result is kick and bass no longer masking each other in the sub, without the pumping effect that overt sidechain creates."

          "id": "overhead-perspective",
          "type": "technique",
          "title": "Overhead Perspective & Phase",
          "oneLiner": "The overhead mics are the picture. The close mics are correction. Get this relationship right.",
          "filters": [
            "recording",
            "mixing"
          ],
          "sections": {
            "whatItDoes": "In live drum recording (or when working with acoustic drum samples), the overhead microphones capture the whole kit as a balanced instrument. The close mics (kick, snare, tom) provide focus and punch. The most common mistake is treating the close mics as the primary signal and the overheads as \"extra.\" Reversing this — making the overheads primary — produces drum sounds that are more natural, cohesive, and musical.",
            "whenUse": "When to use: Any time working with recorded live drums or acoustic drum sample libraries that include room/overhead signals. Less relevant for purely electronic/sampled drums (though a room reverb send simulates the overhead effect).",
            "howToDo": "How to do it: Mix session: bring overhead faders to 0dB. Listen — this is the starting picture. Now bring up the kick close mic until the kick has appropriate punch. Bring up the snare close mic until the crack feels right. Stop adding close mics when they start dominating over the overheads. The close mics are adding definition to a picture that already sounds like a kit. Phase check: in Logic or Ableton, zoom to the sample level and verify the kick waveform polarity on the close mic matches the kick on the overhead. If they're opposite, flip the close mic phase.",
            "wavesPlugins": "Waves plugins: Waves InPhase (dedicated phase alignment tool for multi-mic drum tracks). Waves SSL E-Channel on each channel for HPF and tonal shaping.",
            "keyTip": "Key tip: Phase alignment between the kick close mic and the overheads is the most important technical issue in drum mixing. If they're out of phase, the kick loses low end dramatically — the two signals cancel each other. Zoom to the sample level, look at the kick waveforms on both tracks, and manually nudge the close mic so the peaks align with the overhead peaks."
          },

            "category": "Recording"
          }

// Mutable discipline-level vars — swapped by setDiscipline()
let STYLES = [];
let TECHNIQUES = [];
let CHARACTER = [];
let WRITING = [];
let PROBLEMS = [];
let REFERENCE = [];
let VOCAL = [];
let PRINCIPLES = [];
let DATASETS = {};
let ZONES = [];
let SONG_QUESTIONS = [];
/* @endregion */

/* @region CORE */
const state = {
  discipline: 'bass',
  quickMode: false,
  songAnswers: null,
  activeFilters: {},
  activeCategory: {},
  mounted: new Set(),
};

const DEBUG = new URLSearchParams(location.search).has('debug');

function log(...args) { if (DEBUG) console.log('[ProdRef]', ...args); }

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function qs(sel, root = document) { return root.querySelector(sel); }
function qsa(sel, root = document) { return [...root.querySelectorAll(sel)]; }

function getRecord(dataset, id) {
  const list = DATASETS[dataset];
  return list?.find((r) => r.id === id) ?? null;
}

function getCharacterPair(pairId) {
  return CHARACTER.filter((r) => r.meta?.pairId === pairId);
}

function assertContentCounts() {
  const disc = DISC_DATA[state.discipline];
  if (!disc) return;
  const manifest = disc.manifest;
  const actual = {
    styles: STYLES.length,
    techniques: TECHNIQUES.length,
    character: CHARACTER.length,
    writing: WRITING.length,
    problems: PROBLEMS.length,
    reference: REFERENCE.length,
    vocal: VOCAL.length,
  };
  for (const [k, expected] of Object.entries(manifest)) {
    if (actual[k] !== expected) {
      const msg = `[${state.discipline}] Manifest mismatch ${k}: expected ${expected}, got ${actual[k]}`;
      console.error(msg);
      if (DEBUG) throw new Error(msg);
    }
  }
  console.log(`Content manifest OK [${state.discipline}]`);
}

function initProtocolGate() {
  const isFile = location.protocol === 'file:';
  const banner = qs('#protocol-banner');
  if (banner) banner.hidden = !isFile;
  return !isFile;
}

function setDiscipline(id) {
  const disc = DISC_DATA[id];
  if (!disc) return;
  state.discipline = id;
  localStorage.setItem('prodRef_discipline', id);
  STYLES = disc.datasets.STYLES || [];
  TECHNIQUES = disc.datasets.TECHNIQUES || [];
  CHARACTER = disc.datasets.CHARACTER || [];
  WRITING = disc.datasets.WRITING || [];
  PROBLEMS = disc.datasets.PROBLEMS || [];
  REFERENCE = disc.datasets.REFERENCE || [];
  VOCAL = disc.datasets.VOCAL || [];
  PRINCIPLES = disc.datasets.PRINCIPLES || [];
  DATASETS = { STYLES, TECHNIQUES, CHARACTER, WRITING, PROBLEMS, REFERENCE, VOCAL, PRINCIPLES };
  ZONES = disc.zones;
  SONG_QUESTIONS = disc.songQuestions;
  state.mounted = new Set();
  state.activeFilters = {};
  state.activeCategory = {};
  assertContentCounts();
  wireHeader();
  wireNav();
  mountZone('start-here');
  log('discipline set to', id);
}
/* @endregion */

/* @region RENDER */
function allFiltersForDataset(dataset) {
  const list = DATASETS[dataset] || [];
  return [...new Set(list.flatMap((r) => r.filters || []))].sort();
}

function displayLiner(text) {
  return (text || '').replace(/^One-liner:\s*/i, '').replace(/^Tag:\s*/i, '');
}

function renderCard(record) {
  const tag = record.meta?.tag || record.meta?.category || '';
  return `<article class="card" data-action="open-detail" data-id="${escapeHtml(record.id)}" data-dataset="${escapeHtml(record._dataset || '')}" tabindex="0">
    ${tag ? `<span class="card__tag">${escapeHtml(tag)}</span>` : ''}
    <h3 class="card__title">${escapeHtml(record.title)}</h3>
    <p class="card__liner">${escapeHtml(displayLiner(record.oneLiner))}</p>
  </article>`;
}

function renderCardGrid(zone, container) {
  const list = (DATASETS[zone.dataset] || []).map((r) => ({ ...r, _dataset: zone.dataset }));
  const filters = state.activeFilters[zone.id] || new Set();
  const cat = state.activeCategory?.[zone.id];
  const grid = qs('.zone-grid', container) || container;
  const filtered = list.filter((r) => {
    if (cat && r.meta?.category !== cat) return false;
    if (filters.size && !(r.filters || []).some((f) => filters.has(f))) return false;
    return true;
  });
  grid.innerHTML = filtered.length
    ? filtered.map(renderCard).join('')
    : '<p class="muted">No cards match filters.</p>';
}

function renderFilterBar(zone, container) {
  if (!zone.filters) return;
  const bar = qs('.zone-filters', container);
  if (!bar) return;
  const filters = allFiltersForDataset(zone.dataset);
  const active = state.activeFilters[zone.id] || new Set();
  bar.innerHTML = `<button type="button" class="chip ${active.size === 0 ? 'chip--on' : ''}" data-action="filter" data-zone="${zone.id}" data-filter="">All</button>` +
    filters.map((f) => `<button type="button" class="chip ${active.has(f) ? 'chip--on' : ''}" data-action="filter" data-zone="${zone.id}" data-filter="${escapeHtml(f)}">${escapeHtml(f)}</button>`).join('');
}

function renderCategoryBar(zone, container) {
  if (!zone.categoryFilter) return;
  const bar = qs('.zone-categories', container);
  if (!bar) return;
  const cats = [...new Set((DATASETS[zone.dataset] || []).map((r) => r.meta?.category).filter(Boolean))];
  const active = state.activeCategory?.[zone.id];
  bar.innerHTML = `<button type="button" class="chip ${!active ? 'chip--on' : ''}" data-action="category" data-zone="${zone.id}" data-category="">All</button>` +
    cats.map((c) => `<button type="button" class="chip ${active === c ? 'chip--on' : ''}" data-action="category" data-zone="${zone.id}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
}

function renderDetailSections(record) {
  const schema = DETAIL_SCHEMA[record.type] || [];
  return schema
    .map((field) => {
      let val = record.sections?.[field.key];
      if (val == null || val === '') return '';
      const quickAttr = field.quick ? ' data-quick="true"' : '';
      let inner;
      if (field.list && Array.isArray(val)) {
        inner = `<ol>${val.map((li) => `<li>${escapeHtml(li)}</li>`).join('')}</ol>`;
      } else {
        inner = `<div class="detail-section__body">${escapeHtml(String(val)).replace(/\n/g, '<br>')}</div>`;
      }
      return `<section class="detail-section" ${quickAttr}><h3 class="detail-section__label">${escapeHtml(field.label)}</h3>${inner}</section>`;
    })
    .join('');
}

function openDetail(record, dataset) {
  const dlg = qs('#detail-overlay');
  qs('#detail-title').textContent = record.title;
  const tag = record.meta?.tag || record.meta?.category || record.meta?.group || '';
  const tagEl = qs('#detail-tag');
  tagEl.textContent = tag;
  tagEl.hidden = !tag;
  qs('#detail-body').innerHTML = record.oneLiner
    ? `<p class="detail-liner">${escapeHtml(record.oneLiner)}</p>${renderDetailSections(record)}`
    : renderDetailSections(record);
  dlg.dataset.dataset = dataset || '';
  dlg.dataset.id = record.id;
  dlg.showModal();
}

function openCharacterPair(pairId) {
  const poles = getCharacterPair(pairId);
  if (!poles.length) return;
  const left = poles.find((p) => p.meta?.pole === 'left') || poles[0];
  const right = poles.find((p) => p.meta?.pole === 'right') || poles[1];
  const dlg = qs('#detail-overlay');
  const group = left.meta?.group || '';
  qs('#detail-title').textContent = `${left.meta?.poleName || 'Left'} ↔ ${right.meta?.poleName || 'Right'}`;
  qs('#detail-tag').textContent = group;
  qs('#detail-tag').hidden = !group;
  const helper = left.sections?.helper
    ? `<section class="detail-section detail-section--helper"><h3 class="detail-section__label">If you don't know</h3><div class="detail-section__body">${escapeHtml(left.sections.helper)}</div></section>`
    : '';
  qs('#detail-body').innerHTML =
    `<div class="character-detail">
      <div class="character-pole"><h4>${escapeHtml(left.title)}</h4>${renderDetailSections(left)}</div>
      <div class="character-pole"><h4>${escapeHtml(right.title)}</h4>${renderDetailSections(right)}</div>
    </div>${helper}`;
  dlg.showModal();
}

function renderCharacterMatrix(container) {
  const pairs = [...new Set(CHARACTER.map((r) => r.meta?.pairId))];
  const byGroup = {};
  for (const pairId of pairs) {
    const poles = getCharacterPair(pairId);
    const group = poles[0]?.meta?.group || 'Other';
    if (!byGroup[group]) byGroup[group] = [];
    const left = poles.find((p) => p.meta?.pole === 'left') || poles[0];
    const right = poles.find((p) => p.meta?.pole === 'right') || poles[1];
    byGroup[group].push({ pairId, left, right });
  }
  container.innerHTML = Object.entries(byGroup)
    .map(
      ([group, rows]) => `
    <div class="char-group"><h3 class="char-group__title">${escapeHtml(group)}</h3>
    ${rows
      .map(
        (row) => `
      <div class="char-pair" data-action="open-pair" data-pair="${escapeHtml(row.pairId)}" role="button" tabindex="0">
        <span class="char-pole char-pole--left">${escapeHtml(row.left.meta?.poleName || row.left.title)}</span>
        <span class="char-spectrum"></span>
        <span class="char-pole char-pole--right">${escapeHtml(row.right.meta?.poleName || row.right.title)}</span>
      </div>`
      )
      .join('')}
    </div>`
    )
    .join('');
}

function renderAccordion(zone, container) {
  const list = DATASETS[zone.dataset] || [];
  container.innerHTML = list
    .map(
      (r, i) => `
    <details class="accordion" ${i === 0 ? 'open' : ''}>
      <summary>${escapeHtml(r.title)}</summary>
      <div class="accordion__body">${escapeHtml(r.sections?.body || '').replace(/\n/g, '<br>')}</div>
    </details>`
    )
    .join('');
}

function renderTimeline(zone, container) {
  const list = DATASETS[zone.dataset] || [];
  container.innerHTML = `<ol class="timeline">${list
    .map(
      (r, i) => `
    <li class="timeline__item">
      <span class="timeline__num">${i + 1}</span>
      <div class="timeline__content"><h3>${escapeHtml(r.title)}</h3><div>${escapeHtml(r.sections?.body || '').replace(/\n/g, '<br>')}</div></div>
    </li>`
    )
    .join('')}</ol>`;
}

function renderFoundations(zone, container) {
  const list = DATASETS[zone.dataset] || [];
  if (!list.length) {
    container.innerHTML = '<p class="muted foundations-empty">Foundations content is added as the knowledge base grows. Check back after running the pipeline.</p>';
    return;
  }
  container.innerHTML = list.map((r, i) => `
    <details class="accordion" ${i === 0 ? 'open' : ''}>
      <summary>${escapeHtml(r.title)}</summary>
      <div class="accordion__body foundations-body">
        ${r.oneLiner ? `<p class="detail-liner">${escapeHtml(r.oneLiner)}</p>` : ''}
        ${r.sections?.explanation ? `<div class="detail-section"><h4 class="detail-section__label">What it is</h4><p class="detail-section__body">${escapeHtml(r.sections.explanation).replace(/\n/g, '<br>')}</p></div>` : ''}
        ${r.sections?.whyItMatters ? `<div class="detail-section"><h4 class="detail-section__label">Why it matters</h4><p class="detail-section__body">${escapeHtml(r.sections.whyItMatters).replace(/\n/g, '<br>')}</p></div>` : ''}
        ${r.sections?.misconception ? `<div class="detail-section detail-section--helper"><h4 class="detail-section__label">Common misconception</h4><p class="detail-section__body">${escapeHtml(r.sections.misconception).replace(/\n/g, '<br>')}</p></div>` : ''}
        ${r.sections?.hearIt ? `<div class="detail-section"><h4 class="detail-section__label">Hear it</h4><p class="detail-section__body">${escapeHtml(r.sections.hearIt).replace(/\n/g, '<br>')}</p></div>` : ''}
      </div>
    </details>
  `).join('');
}

function renderSongForm(container, onSubmitId) {
  container.innerHTML = `
    <form class="song-form" id="${onSubmitId}">
      ${SONG_QUESTIONS.map(
        (q) => `
        <label class="field">
          <span class="field__label">${escapeHtml(q.label)}</span>
          <select name="${q.id}" required>
            <option value="">Select…</option>
            ${q.options.map((o) => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}
          </select>
        </label>`
      ).join('')}
      <button type="submit" class="btn btn--primary">Get recommendation</button>
    </form>`;
}

function renderStartHereResult(container, result) {
  if (!result || !result.byType || Object.keys(result.byType).length === 0) {
    container.innerHTML = `
      <div class="start-result start-result--empty">
        <p>No matching records yet — the knowledge base grows as research is added to the pipeline.</p>
        <p class="muted" style="margin-top:var(--space-xs)">In the meantime, explore the Styles, Techniques, and Character zones directly.</p>
      </div>`;
    return;
  }
  const typeOrder = ['style', 'technique', 'character', 'principle'];
  const typeLabels = { style: 'Style', technique: 'Techniques', character: 'Character', principle: 'Foundations' };
  let html = '<article class="start-result">';
  for (const type of typeOrder) {
    const records = result.byType[type];
    if (!records || !records.length) continue;
    html += `<section class="api-block">
      <h4>${escapeHtml(typeLabels[type] || type)}</h4>
      <div class="start-result__cards">
        ${records.map((r) => `
          <button type="button" class="start-result__card"
                  data-action="open-detail"
                  data-id="${escapeHtml(r.id)}"
                  data-dataset="${escapeHtml(r._dataset || '')}">
            <strong class="start-result__card-title">${escapeHtml(r.title)}</strong>
            <span class="start-result__card-liner">${escapeHtml(r.oneLiner || '')}</span>
          </button>`).join('')}
      </div>
    </section>`;
  }
  html += '</article>';
  container.innerHTML = html;
}

// ---------------------------------------------------------------------------
// Start Here scoring engine — pure JS, no API calls
// ---------------------------------------------------------------------------

function scoreRecord(record, answers) {
  const ctx = record.context;
  if (!ctx || typeof ctx !== 'object') return 0;
  let score = 0;
  const answerMap = {};
  for (const [k, v] of Object.entries(answers || {})) {
    answerMap[k] = (v || '').toLowerCase();
  }
  for (const [dim, tags] of Object.entries(ctx)) {
    if (!Array.isArray(tags) || !tags.length) continue;
    const answer = answerMap[dim] || '';
    if (!answer) continue;
    // Score 1 point per dimension that has any keyword match
    for (const tag of tags) {
      const words = tag.toLowerCase().split(/[\s-]+/).filter((w) => w.length > 2);
      if (words.some((w) => answer.includes(w))) {
        score += 1;
        break; // One match per dimension
      }
    }
  }
  return score;
}

function runStartHereScoring(answers) {
  const pool = [
    ...STYLES.map((r) => ({ ...r, _dataset: 'STYLES' })),
    ...TECHNIQUES.map((r) => ({ ...r, _dataset: 'TECHNIQUES' })),
    // Only show character poles that represent a full pair concept (skip right-pole dupes in results)
    ...CHARACTER.filter((r) => !r.meta?.pole || r.meta.pole !== 'right').map((r) => ({ ...r, _dataset: 'CHARACTER' })),
    ...PRINCIPLES.map((r) => ({ ...r, _dataset: 'PRINCIPLES' })),
  ];
  const scored = pool
    .map((r) => ({ record: r, score: scoreRecord(r, answers) }))
    .filter((x) => x.score > 0)
    .sort((a, b) => b.score - a.score);
  const byType = {};
  for (const { record } of scored) {
    const type = record.type;
    if (!byType[type]) byType[type] = [];
    if (byType[type].length < 3) byType[type].push(record);
  }
  return { byType, total: scored.length };
}

function mountZone(zoneId) {
  if (state.mounted.has(zoneId)) return;
  const zone = ZONES.find((z) => z.id === zoneId);
  const section = qs(`#zone-${zoneId}`);
  if (!zone || !section) return;

  if (zone.layout === 'card-grid') {
    renderFilterBar(zone, section);
    renderCategoryBar(zone, section);
    renderCardGrid(zone, section);
  } else if (zone.layout === 'character-matrix') {
    renderCharacterMatrix(qs('.zone-body', section));
  } else if (zone.layout === 'accordion') {
    renderAccordion(zone, qs('.zone-body', section));
  } else if (zone.layout === 'timeline') {
    renderTimeline(zone, qs('.zone-body', section));
  } else if (zone.layout === 'start-here') {
    renderSongForm(qs('.zone-body', section), 'start-here-form');
  } else if (zone.layout === 'foundations') {
    renderFoundations(zone, qs('.zone-body', section));
  }

  section.dataset.mounted = 'true';
  state.mounted.add(zoneId);
  log('mounted', zoneId);
}

/* @endregion */

/* @region INIT */
function handleClick(e) {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;

  if (action === 'set-discipline') {
    setDiscipline(t.dataset.disc);
  } else if (action === 'open-detail') {
    const rec = getRecord(t.dataset.dataset, t.dataset.id);
    if (rec) openDetail(rec, t.dataset.dataset);
  } else if (action === 'open-pair') {
    openCharacterPair(t.dataset.pair);
  } else if (action === 'filter') {
    const zoneId = t.dataset.zone;
    const f = t.dataset.filter;
    if (!state.activeFilters[zoneId]) state.activeFilters[zoneId] = new Set();
    const set = state.activeFilters[zoneId];
    if (!f) set.clear();
    else {
      if (set.has(f)) set.delete(f);
      else set.add(f);
    }
    const zone = ZONES.find((z) => z.id === zoneId);
    mountZone(zoneId);
    renderFilterBar(zone, qs(`#zone-${zoneId}`));
    renderCardGrid(zone, qs(`#zone-${zoneId}`));
  } else if (action === 'category') {
    const zoneId = t.dataset.zone;
    if (!state.activeCategory) state.activeCategory = {};
    state.activeCategory[zoneId] = t.dataset.category || null;
    const zone = ZONES.find((z) => z.id === zoneId);
    mountZone(zoneId);
    renderCategoryBar(zone, qs(`#zone-${zoneId}`));
    renderCardGrid(zone, qs(`#zone-${zoneId}`));
  } else if (action === 'nav-zone') {
    const zoneId = t.dataset.zone;
    mountZone(zoneId);
    qs(`#zone-${zoneId}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else if (action === 'toggle-quick') {
    state.quickMode = !state.quickMode;
    document.body.classList.toggle('quick-mode', state.quickMode);
    t.setAttribute('aria-pressed', String(state.quickMode));
  } else if (action === 'close-detail') {
    qs('#detail-overlay')?.close();
  }
}

function handleKeydown(e) {
  if (e.key === 'Escape') {
    qs('#detail-overlay')?.open && qs('#detail-overlay').close();
  }
}

function handleHash() {
  const raw = (location.hash || '').replace('#', '');
  const id = raw.startsWith('zone-') ? raw.slice(5) : raw;
  if (id && ZONES.find((z) => z.id === id)) mountZone(id);
}

function wireHeader() {
  const nav = qs('#discipline-nav');
  if (!nav) return;
  nav.innerHTML = DISCIPLINES.map((d) =>
    `<button type="button" class="disc-tab ${state.discipline === d.id ? 'disc-tab--on' : ''}" data-action="set-discipline" data-disc="${d.id}">${escapeHtml(d.label)}</button>`
  ).join('');
}

function wireSessionStrip() {
  ['ctx-bpm', 'ctx-key', 'ctx-genre'].forEach((id) => {
    const el = qs(`#${id}`);
    if (!el) return;
    el.value = localStorage.getItem(`prodRef_${id}`) || '';
    el.addEventListener('input', () => localStorage.setItem(`prodRef_${id}`, el.value));
  });
}

function wireNav() {
  const nav = qs('#main-nav');
  nav.innerHTML =
    ZONES.map(
      (z) => `<a class="nav__link" href="#zone-${z.id}" data-action="nav-zone" data-zone="${z.id}">${escapeHtml(z.label)}</a>`
    ).join('') +
    `<button type="button" class="nav__quick" data-action="toggle-quick" aria-pressed="${state.quickMode}">Quick Mode</button>`;

  const main = qs('#main');
  main.innerHTML = ZONES.map((z) => {
    if (z.layout === 'card-grid' || z.layout === 'character-matrix') {
      return `<section class="zone" id="zone-${z.id}" data-zone="${z.id}" data-mounted="false">
        <h2 class="zone__title">${escapeHtml(z.label)}</h2>
        ${z.filters ? '<div class="zone-filters"></div>' : ''}
        ${z.categoryFilter ? '<div class="zone-categories"></div>' : ''}
        <div class="zone-grid zone-body"></div>
      </section>`;
    }
    if (z.layout === 'accordion' || z.layout === 'timeline' || z.layout === 'start-here' || z.layout === 'foundations') {
      const extra = z.id === 'start-here' ? '<div id="start-here-result" class="api-result"></div>' : '';
      return `<section class="zone" id="zone-${z.id}" data-zone="${z.id}" data-mounted="false">
        <h2 class="zone__title">${escapeHtml(z.label)}</h2>
        <div class="zone-body">${extra}</div>
      </section>`;
    }
    return '';
  }).join('');

  if (window._zoneObserver) window._zoneObserver.disconnect();
  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) mountZone(en.target.dataset.zone);
      });
    },
    { rootMargin: '200px' }
  );
  window._zoneObserver = observer;
  qsa('.zone').forEach((s) => observer.observe(s));
}

function wireForms() {
  document.addEventListener('submit', (e) => {
    if (e.target.id === 'start-here-form') {
      e.preventDefault();
      const fd = new FormData(e.target);
      const answers = Object.fromEntries(fd.entries());
      submitStartHere(answers);
    }
  });
}

const ProdRef = (() => {
  function init() {
    initProtocolGate();
    // Restore saved discipline and hydrate module-level vars
    const savedId = localStorage.getItem('prodRef_discipline') || 'bass';
    const disc = DISC_DATA[savedId] || DISC_DATA['bass'];
    state.discipline = disc ? savedId : 'bass';
    const activeDisc = DISC_DATA[state.discipline];
    STYLES = activeDisc.datasets.STYLES || [];
    TECHNIQUES = activeDisc.datasets.TECHNIQUES || [];
    CHARACTER = activeDisc.datasets.CHARACTER || [];
    WRITING = activeDisc.datasets.WRITING || [];
    PROBLEMS = activeDisc.datasets.PROBLEMS || [];
    REFERENCE = activeDisc.datasets.REFERENCE || [];
    VOCAL = activeDisc.datasets.VOCAL || [];
    PRINCIPLES = activeDisc.datasets.PRINCIPLES || [];
    DATASETS = { STYLES, TECHNIQUES, CHARACTER, WRITING, PROBLEMS, REFERENCE, VOCAL, PRINCIPLES };
    ZONES = activeDisc.zones;
    SONG_QUESTIONS = activeDisc.songQuestions;
    assertContentCounts();
    wireHeader();
    wireSessionStrip();
    wireNav();
    wireForms();
    document.addEventListener('click', handleClick);
    document.addEventListener('keydown', handleKeydown);
    window.addEventListener('hashchange', handleHash);
    handleHash();
    mountZone('start-here');
  }
  return { init, getState: () => ({ ...state }) };
})();

document.addEventListener('DOMContentLoaded', () => ProdRef.init());
/* @endregion */

</script>
