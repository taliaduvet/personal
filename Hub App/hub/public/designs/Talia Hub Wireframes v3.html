<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talia Duvet — Hub Wireframes v3</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    #root { width: 100vw; height: 100vh; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="wireframes/primitives.jsx"></script>
  <script type="text/babel" src="wireframes/tweaks-panel.jsx"></script>

  <script type="text/babel" src="wireframes/product-detail.jsx"></script>
  <script type="text/babel" src="wireframes/pricing-page.jsx"></script>
  <script type="text/babel" src="wireframes/account.jsx"></script>
  <script type="text/babel" src="wireframes/auth.jsx"></script>
  <script type="text/babel" src="wireframes/vein-app.jsx"></script>
  <script type="text/babel" src="wireframes/ledger-app.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "showNotes": true,
      "showAnnos": true,
      "tilt": true,
      "accent": "#9b6cff",
      "userAccent": "#9b6cff"
    }/*EDITMODE-END*/;

    function Intro() {
      return (
        <div style={{
          padding: '18px 26px',
          background: '#1a1816',
          color: '#f6f2ea',
          borderRadius: '8px 12px 6px 10px / 10px 6px 12px 8px',
          maxWidth: 820,
          fontFamily: '"Caveat", cursive',
        }}>
          <div style={{
            fontFamily: '"JetBrains Mono", monospace',
            fontSize: 10,
            color: '#e07a5f',
            letterSpacing: '0.2em',
            textTransform: 'uppercase',
            marginBottom: 6,
          }}>
            ─── round 03 · filling in the gaps ───
          </div>
          <div style={{ fontSize: 30, fontWeight: 700, lineHeight: 1, marginBottom: 8 }}>
            product pages · pricing · account · auth
          </div>
          <div style={{ fontSize: 17, lineHeight: 1.3, color: 'rgba(246,242,234,0.85)' }}>
            v1 hub + admin + workspace exist. these are the surfaces in between —<br />
            the marketing detail pages, the rent-to-own deep dive, the post-purchase home,<br />
            and the first-run onboarding for vein.
          </div>
          <div style={{
            marginTop: 14,
            fontFamily: '"JetBrains Mono", monospace',
            fontSize: 10.5,
            color: 'rgba(246,242,234,0.55)',
            letterSpacing: '0.05em',
          }}>
            ▸ open the <span style={{ color: '#f4d77a' }}>tweaks panel</span> (toolbar) to toggle notes, annotations, tilt &amp; accent.
            <br />▸ drag ⤢ on any artboard to focus it · ←/→/esc to navigate.
          </div>
        </div>
      );
    }

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // Apply tweaks as global style overrides
      React.useEffect(() => {
        let s = document.getElementById('tweak-overrides');
        if (!s) {
          s = document.createElement('style');
          s.id = 'tweak-overrides';
          document.head.appendChild(s);
        }
        // Derive a soft glow rgba from the chosen user accent
        const hex = (t.userAccent || '#9b6cff').replace('#', '');
        const r = parseInt(hex.substr(0, 2), 16);
        const g = parseInt(hex.substr(2, 2), 16);
        const b = parseInt(hex.substr(4, 2), 16);
        const glow = `rgba(${r},${g},${b},0.30)`;

        s.textContent = `
          :root {
            --user-accent: ${t.userAccent};
            --user-accent-glow: ${glow};
          }
          ${!t.showNotes ? '.wf-note { display: none !important; }' : ''}
          ${!t.showAnnos ? '.wf-anno { opacity: 0.25 !important; }' : ''}
          ${!t.tilt ? `
            .wf-box, .wf-box-soft, .wf-box-dashed, .wf-pill, .wf-btn, .wf-img-placeholder {
              border-radius: 4px !important;
            }
            .wf-tilt-l, .wf-tilt-r { transform: none !important; }
          ` : ''}
          .wf-pill.accent, .wf-btn.accent {
            background: ${t.accent} !important;
            border-color: ${t.accent} !important;
            box-shadow: 2px 2px 0 ${t.accent} !important;
          }
          .wf-note, .wf-arrow { color: ${t.accent} !important; }
        `;
      }, [t]);

      return (
        <React.Fragment>
          <DesignCanvas>

            <DCSection id="intro" title="Round 03" subtitle="filling in the gaps">
              <DCArtboard id="intro-card" label="brief" width={880} height={240}
                style={{ background: 'transparent', border: 'none', boxShadow: 'none' }}>
                <Intro />
              </DCArtboard>
            </DCSection>

            <DCSection
              id="product-detail"
              title="01 · Product detail pages"
              subtitle="one page per tool, deeper than the homepage card"
            >
              <DCArtboard id="pd-vein" label="Vein · /tools/vein" width={760} height={920}>
                <VeinDetail />
              </DCArtboard>
              <DCArtboard id="pd-ledger" label="Ledger · /tools/ledger" width={760} height={920}>
                <LedgerDetail />
              </DCArtboard>
              <DCArtboard id="pd-production" label="Production · /tools/production" width={760} height={920}>
                <ProductionDetail />
              </DCArtboard>
            </DCSection>

            <DCSection
              id="pricing"
              title="02 · Pricing page"
              subtitle="the manifesto · rent-to-own deep dive · comparison · FAQ"
            >
              <DCArtboard id="pricing-main" label="Pricing · /pricing" width={1000} height={1200}>
                <PricingPage />
              </DCArtboard>
            </DCSection>

            <DCSection
              id="account"
              title="03 · Hub · the user's home"
              subtitle="post-purchase home · tool launcher · r2o progress · the one place user-level accent color lives"
            >
              <DCArtboard id="account-main" label="Hub · hub.taliaduvet.com" width={1080} height={1240}>
                <AccountLibrary />
              </DCArtboard>
            </DCSection>

            <DCSection
              id="auth"
              title="04 · Sign-in + first-run"
              subtitle="magic-link sign in · 4-step onboarding for Vein"
            >
              <DCArtboard id="auth-signin" label="Sign in · /sign-in" width={840} height={560}>
                <SignIn />
              </DCArtboard>
              <DCArtboard id="auth-onboard" label="Vein onboarding · /welcome" width={880} height={680}>
                <Onboarding />
              </DCArtboard>
            </DCSection>

            <DCSection
              id="vein-app"
              title="05 · Vein · reskin proposal"
              subtitle="hub brand applied to the existing app · cosmic surface, violet for action, periwinkle as vein's flavor"
            >
              <DCArtboard id="vein-login" label="01 · Login" width={360} height={640}>
                <VeinLogin />
              </DCArtboard>
              <DCArtboard id="vein-library" label="02 · Library" width={360} height={760}>
                <VeinLibrary />
              </DCArtboard>
              <DCArtboard id="vein-memo" label="03 · Memo detail" width={360} height={840}>
                <VeinMemoDetail />
              </DCArtboard>
              <DCArtboard id="vein-record" label="04 · Recording" width={360} height={640}>
                <VeinRecord />
              </DCArtboard>
              <DCArtboard id="vein-settings" label="05 · Settings · pick action color" width={360} height={840}>
                <VeinSettings />
              </DCArtboard>
            </DCSection>

            <DCSection
              id="ledger-app"
              title="06 · Ledger · reskin proposal"
              subtitle="paper surface, violet for action, mauve as ledger's flavor · desktop"
            >
              <DCArtboard id="ledger-login" label="01 · Sign in" width={1040} height={620}>
                <LedgerLogin />
              </DCArtboard>
              <DCArtboard id="ledger-dashboard" label="02 · Dashboard" width={1100} height={820}>
                <LedgerDashboard />
              </DCArtboard>
              <DCArtboard id="ledger-expenses" label="03 · Books · expense focus" width={1100} height={920}>
                <LedgerExpenses />
              </DCArtboard>
              <DCArtboard id="ledger-reports" label="04 · Reports · T2125 + GST + GF medical" width={1100} height={1380}>
                <LedgerReports />
              </DCArtboard>
              <DCArtboard id="ledger-books" label="05 · Books · unified entries + bank" width={1100} height={880}>
                <LedgerBooks />
              </DCArtboard>
              <DCArtboard id="ledger-plan" label="06 · Plan · budget" width={1100} height={1100}>
                <LedgerPlan />
              </DCArtboard>
              <DCArtboard id="ledger-tabs-note" label="tab consolidation"
                width={760} height={420}
                style={{ background: '#fef4a8' }}>
                <div style={{ padding: 22, fontFamily: '"Caveat", cursive', fontSize: 18, lineHeight: 1.25, color: '#5a4a2a' }}>
                  <div style={{
                    fontFamily: '"JetBrains Mono", monospace', fontSize: 10,
                    letterSpacing: '0.2em', textTransform: 'uppercase',
                    color: '#a8722b', marginBottom: 10,
                  }}>
                    — 7 tabs → 4 tabs
                  </div>
                  <div style={{ marginBottom: 12, fontSize: 22, fontWeight: 700 }}>
                    less to navigate. more done.
                  </div>
                  <div style={{ fontFamily: '"Inter", sans-serif', fontSize: 13.5, lineHeight: 1.6, color: '#3d3833' }}>
                    <div style={{ display: 'grid', gridTemplateColumns: '110px 30px 1fr', gap: '6px 12px', marginTop: 4 }}>
                      <div style={{ fontWeight: 600 }}>today</div>
                      <div style={{ color: '#a8722b' }}>←</div>
                      <div>dashboard (the home you land on)</div>

                      <div style={{ fontWeight: 600 }}>books</div>
                      <div style={{ color: '#a8722b' }}>←</div>
                      <div>income + expenses + bank import + reconcile, one table, filter chips swap the view. drop a csv anywhere in the row.</div>

                      <div style={{ fontWeight: 600 }}>plan</div>
                      <div style={{ color: '#a8722b' }}>←</div>
                      <div>budget (planned vs actual)</div>

                      <div style={{ fontWeight: 600 }}>reports</div>
                      <div style={{ color: '#a8722b' }}>←</div>
                      <div>T2125 + GST/HST + GF medical claim (year-end / form outputs)</div>
                    </div>
                    <div style={{ marginTop: 14, fontFamily: '"Caveat", cursive', fontSize: 17, color: '#a8722b' }}>
                      bank stops being a tab · it becomes an action inside books.<br/>
                      GF medical stops being a tab · it's a section inside reports.
                    </div>
                  </div>
                </div>
              </DCArtboard>
            </DCSection>

            <DCSection
              id="notes"
              title="next"
              subtitle="things to decide / show me"
            >
              <DCArtboard id="next-card" label="open questions"
                width={760} height={360}
                style={{ background: '#fef4a8' }}>
                <div style={{ padding: 22, fontFamily: '"Caveat", cursive', fontSize: 18, lineHeight: 1.25, color: '#5a4a2a' }}>
                  <div style={{
                    fontFamily: '"JetBrains Mono", monospace', fontSize: 10,
                    letterSpacing: '0.2em', textTransform: 'uppercase',
                    color: '#a8722b', marginBottom: 8,
                  }}>
                    — brand reconciliation · vein
                  </div>
                  <div style={{ marginBottom: 10 }}>
                    your draft brand-guide.md leaned <b>plum + magenta</b>. the hub system goes <b>cosmic navy + violet</b> with periwinkle as vein's flavor.
                  </div>
                  <div style={{ marginBottom: 4 }}>this reskin proposes:</div>
                  <div style={{ fontFamily: '"Inter", sans-serif', fontSize: 13.5, lineHeight: 1.5, color: '#3d3833' }}>
                    · bg ·· #18121c plum &rarr; <b>#0c0e1a cosmic navy</b><br />
                    · accent ·· #d65a9a magenta &rarr; <b>#9b6cff violet</b> (house) for actions<br />
                    · vein flavor ·· mint &rarr; <b>periwinkle</b> #b0cdfd (halos, fragment markers)<br />
                    · type ·· Instrument Sans &rarr; <b>Instrument Serif</b> for the wordmark + Inter for body<br />
                    · once you sign off, i'll edit <code>index.css</code> + <code>brand.ts</code> + reshape Button / Badge / MemoListItem to match.
                  </div>
                </div>
              </DCArtboard>
            </DCSection>

          </DesignCanvas>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Visibility" />
            <TweakToggle label="Show notes" value={t.showNotes}
                         onChange={(v) => setTweak('showNotes', v)} />
            <TweakToggle label="Show annotations" value={t.showAnnos}
                         onChange={(v) => setTweak('showAnnos', v)} />
            <TweakSection label="Style" />
            <TweakToggle label="Sketchy tilt" value={t.tilt}
                         onChange={(v) => setTweak('tilt', v)} />
            <TweakColor label="Wireframe accent" value={t.accent}
                        options={['#e07a5f', '#9b6cff', '#7a4ce0', '#fcd47a', '#8bcba6']}
                        onChange={(v) => setTweak('accent', v)} />
            <TweakSection label="User · action color (follows you everywhere)" />
            <TweakColor label="Action color" value={t.userAccent}
                        options={['#9b6cff', '#b0cdfd', '#b198b1', '#fbcb94', '#8bcba6', '#fcd47a']}
                        onChange={(v) => setTweak('userAccent', v)} />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
